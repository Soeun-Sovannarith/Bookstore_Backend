spring.application.name=bookstore

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

api.key=${API_KEY}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Enable debug logging for security to troubleshoot 403 issues
logging.level.com.example.bookstore.security=DEBUG
logging.level.org.springframework.security=DEBUG

# Bakong Individual Account Configuration
bakong.account.id=${BAKONG_ACCOUNT_ID}
bakong.account.phone=${BAKONG_ACCOUNT_PHONE}
bakong.acquiring.bank=${BAKONG_ACQUIRING_BANK}
bakong.merchant.name=${BAKONG_MERCHANT_NAME}
bakong.merchant.city=${BAKONG_MERCHANT_CITY}
bakong.store.label=${BAKONG_STORE_LABEL}
bakong.terminal.label=${BAKONG_TERMINAL_LABEL}
bakong.api.token=${BAKONG_API_TOKEN}

# Stripe Payment Configuration
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
